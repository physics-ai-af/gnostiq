[project]
name = "gnostiq"
version = "0.1.0"
description = "Physics-constrained post-processing of global NWP for Jos, Nigeria"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=18",
    "requests>=2.32",
    "tzdata==2026.6",
    "tzdata; sys_platform == 'win32'",
]

[project.scripts]
gnostiq = "gnostiq.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.hatch.envs.default]
dependency-groups = ["dev"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
