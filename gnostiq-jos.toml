# Jos has no public station record that passes scripts/gate.py, so nothing can be trained or scored here.
# It runs the networks trained for gnostiq.toml on its own model forecast and terrain height.

[site]
name = "jos"
wmo = "65134"
icao = "DNJO"
ghcnh = "NII0000DNJO"
lat = 9.6398                  # Yakubu Gowon airport, from the GHCNh record
lon = 8.8691
elev_m = 1289.9
tz = "Africa/Lagos"
bbox = [9.4, 10.1, 8.6, 9.2]  # lat0, lat1, lon0, lon1

[model]
from = "gnostiq.toml"         # window, truth, nwp and forecast settings come from there too

[paths]
data = "data/jos"
