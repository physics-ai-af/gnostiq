# Settings shared by every site, then one table per site. The first site is the default for every command;
# --site picks another, --all-sites runs them all.

[window]
start = 2021-01-01            # station history for climatology and QC
train_end = 2025-03-31        # model pairs start with the forecast archive, Jan 2024
test_start = 2025-04-01
test_end = 2025-10-31         # Nigerian reports thin out from April 2026
wet_months = [4, 5, 6, 7, 8, 9, 10]

# set from the gate report
[truth]
temp = "ghcnh"                # ghcnh | iem | merged
rain = "chirps"               # station | chirps
chirps_flavor = "sat"         # sat | rnl

[nwp]
base = "ecmwf_ifs025"
extra = ["gfs_seamless", "icon_seamless"]  # inputs to the networks and emos_multi
compare = ["ecmwf_aifs025_single", "meteofrance_arpege_world", "jma_gsm", "gem_global"]  # scored only
start = 2024-01-01            # archive starts Jan 2024
chunk_days = 92

[forecast]
lead_days = [1, 2, 3, 4, 5, 6, 7]
wet_mm = 1.0
heavy_mm = 10.0

[model]
seeds = 3
hidden = 64
max_epochs = 300
patience = 25
eff_max = 2.0                 # cap on rain / precipitable water

[sites.abuja]
wmo = "65125"
icao = "DNAA"
ghcnh = "NIM00065125"         # Abuja synop, from the gate
lat = 9.0068
lon = 7.2632
elev_m = 342.0
tz = "Africa/Lagos"
bbox = [8.8, 9.2, 7.0, 7.5]   # lat0, lat1, lon0, lon1
data = "data/abuja"

# no public record that passes the gate, so nothing is trained here
[sites.jos]
wmo = "65134"
icao = "DNJO"
ghcnh = "NII0000DNJO"
lat = 9.6398                  # Yakubu Gowon airport, from the GHCNh record
lon = 8.8691
elev_m = 1289.9
tz = "Africa/Lagos"
bbox = [9.4, 10.1, 8.6, 9.2]
data = "data/jos"
borrow = "abuja"              # runs abuja's networks on its own forecast and height
